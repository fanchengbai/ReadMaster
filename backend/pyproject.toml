[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "readmaster-backend"
version = "0.1.0"
description = "ReadMaster local API service"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "charset-normalizer>=3.4,<4",
    "fastapi>=0.116,<1",
    "pydantic-settings>=2.10,<3",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

